version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vigilancia-db
    environment:
      POSTGRES_USER: vigilancia_user
      POSTGRES_PASSWORD: vigilancia_password
      POSTGRES_DB: vigilancia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilancia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vigilancia-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
